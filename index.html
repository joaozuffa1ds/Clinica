<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cadastro de Pessoas</title>

<style>

body{
  font-family:Arial;
  background:#f2f2f2;
  text-align:center;
  margin:0;
  padding:20px;
}

h2{
  color:#2196f3;
}

table{
  margin:20px auto;
  border-collapse:collapse;
  width:95%;
  background:white;
}

th, td{
  border:1px solid #ccc;
  padding:10px;
}

th{
  background:#2196f3;
  color:white;
}

button{
  margin:5px;
  padding:8px 15px;
  background:#2196f3;
  color:white;
  border:none;
  cursor:pointer;
  border-radius:4px;
}

button:hover{
  background:#1976d2;
}

.excluir{
  background:red;
}

.excluir:hover{
  background:darkred;
}

.pdf{
  background:#4caf50;
}

.pdf:hover{
  background:#2e7d32;
}

tr:nth-child(even){
  background:#f9f9f9;
}

td:focus{
  background:#fff8c4;
}

#usuario{
  margin-top:10px;
  font-weight:bold;
  color:#333;
}

</style>

</head>

<body>

<h2>Cadastro de Pessoas</h2>

<button onclick="loginGoogle()">
 Entrar com Google
</button>

<p id="usuario"></p>

<br>

<button onclick="adicionar()">
Adicionar Pessoa
</button>

<button onclick="ordenar()">
Ordenar por Nome
</button>

<table id="tabela">

<thead>

<tr>
<th>Nome</th>
<th>Telefone</th>
<th>CPF</th>
<th>RG</th>
<th>Observação</th>
<th>Tratamento</th>
<th>Ação</th>
</tr>

</thead>

<tbody></tbody>

</table>

<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

/* SENHA */

const senha = "14162130";

/* TABELA */

const tabela = document.querySelector("#tabela tbody");

/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey: "SUA_API_KEY",

  authDomain: "SEU_PROJETO.firebaseapp.com",

  projectId: "SEU_PROJETO",

  storageBucket: "SEU_PROJETO.appspot.com",

  messagingSenderId: "SEU_ID",

  appId: "SEU_APP_ID"

};

/* INICIAR FIREBASE */

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

const db = firebase.firestore();

let usuarioLogado = null;

/* LOGIN GOOGLE */

function loginGoogle(){

  const provider =
    new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)

  .then((result)=>{

    usuarioLogado = result.user;

    document.getElementById("usuario").innerText =

      "Logado como: " + usuarioLogado.email;

    carregar();

  })

  .catch((error)=>{

    alert(error.message);

  });
}

/* ADICIONAR */

function adicionar(){

  if(!usuarioLogado){

    alert("Faça login primeiro!");

    return;

  }

  const s = prompt("Digite a senha para adicionar:");

  if(s===senha){

    const linha = document.createElement("tr");

    linha.innerHTML = `
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>
      <td contenteditable="true"></td>

      <td>

        <button onclick="editar(this)">
          Salvar
        </button>

        <button class="pdf" onclick="gerarPDFPaciente(this)">
          PDF
        </button>

        <button class="excluir" onclick="remover(this)">
          Excluir
        </button>

      </td>
    `;

    tabela.appendChild(linha);

    salvar();

  }else{

    alert("Senha incorreta!");

  }
}

/* EDITAR */

function editar(botao){

  const linha = botao.parentElement.parentElement;

  if(botao.textContent==="Editar"){

    const s = prompt("Digite a senha para editar:");

    if(s===senha){

      linha.querySelectorAll("td").forEach((td,i)=>{

        if(i<6){
          td.contentEditable="true";
        }

      });

      botao.textContent="Salvar";

    }else{

      alert("Senha incorreta!");

    }

  }else{

    linha.querySelectorAll("td").forEach((td,i)=>{

      if(i<6){
        td.contentEditable="false";
      }

    });

    botao.textContent="Editar";

    salvar();
  }
}

/* REMOVER */

function remover(botao){

  const s = prompt("Digite a senha para excluir:");

  if(s===senha){

    if(confirm("Deseja realmente excluir?")){

      botao.parentElement.parentElement.remove();

      salvar();

    }

  }else{

    alert("Senha incorreta!");

  }
}

/* SALVAR FIRESTORE */

async function salvar(){

  if(!usuarioLogado) return;

  const dados = [];

  tabela.querySelectorAll("tr").forEach(linha=>{

    const col = linha.querySelectorAll("td");

    if(col.length >= 6){

      dados.push({

        nome: col[0].innerText.trim(),
        telefone: col[1].innerText.trim(),
        cpf: col[2].innerText.trim(),
        rg: col[3].innerText.trim(),
        obs: col[4].innerText.trim(),
        tratamento: col[5].innerText.trim()

      });
    }
  });

  await db.collection("fichas")

  .doc(usuarioLogado.uid)

  .set({

    pacientes:dados

  });
}

/* CARREGAR FIRESTORE */

async function carregar(){

  if(!usuarioLogado) return;

  const doc = await db

  .collection("fichas")

  .doc(usuarioLogado.uid)

  .get();

  tabela.innerHTML = "";

  if(doc.exists){

    const dados = doc.data().pacientes || [];

    dados.forEach(d=>{

      const linha = document.createElement("tr");

      linha.innerHTML = `

        <td contenteditable="false">${d.nome}</td>
        <td contenteditable="false">${d.telefone}</td>
        <td contenteditable="false">${d.cpf}</td>
        <td contenteditable="false">${d.rg}</td>
        <td contenteditable="false">${d.obs}</td>
        <td contenteditable="false">${d.tratamento}</td>

        <td>

          <button onclick="editar(this)">
            Editar
          </button>

          <button class="pdf"
          onclick="gerarPDFPaciente(this)">
            PDF
          </button>

          <button class="excluir"
          onclick="remover(this)">
            Excluir
          </button>

        </td>
      `;

      tabela.appendChild(linha);
    });
  }
}

/* ORDENAR */

function ordenar(){

  const linhas = Array.from(
    tabela.querySelectorAll("tr")
  );

  linhas.sort((a,b)=>

    a.children[0].innerText
    .toLowerCase()

    .localeCompare(

      b.children[0].innerText.toLowerCase()

    )

  );

  tabela.innerHTML="";

  linhas.forEach(linha=>
    tabela.appendChild(linha)
  );

  salvar();
}

/* PDF INDIVIDUAL */

function gerarPDFPaciente(botao){

  const linha = botao.parentElement.parentElement;

  const col = linha.querySelectorAll("td");

  const nome = col[0].innerText;
  const telefone = col[1].innerText;
  const cpf = col[2].innerText;
  const rg = col[3].innerText;
  const obs = col[4].innerText;
  const tratamento = col[5].innerText;

  const janela =
    window.open('', '', 'width=800,height=700');

  janela.document.write(`

    <html>

    <head>

      <title>Ficha do Paciente</title>

      <style>

        body{
          font-family:Arial;
          padding:30px;
          background:#f2f2f2;
        }

        .card{

          background:white;

          border-radius:10px;

          padding:30px;

          max-width:600px;

          margin:auto;

          box-shadow:0 0 10px rgba(0,0,0,0.2);

        }

        h1{
          text-align:center;
          color:#2196f3;
        }

        p{
          font-size:18px;
          margin:15px 0;
        }

        strong{
          color:#1976d2;
        }

      </style>

    </head>

    <body>

      <div class="card">

        <h1>Ficha do Paciente</h1>

        <p><strong>Nome:</strong> ${nome}</p>

        <p><strong>Telefone:</strong> ${telefone}</p>

        <p><strong>CPF:</strong> ${cpf}</p>

        <p><strong>RG:</strong> ${rg}</p>

        <p><strong>Observação:</strong> ${obs}</p>

        <p><strong>Tratamento:</strong> ${tratamento}</p>

      </div>

    </body>

    </html>

  `);

  janela.document.close();

  janela.print();
}

</script>

</body>

</html>
